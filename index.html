  <script>
    (() => {
      document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', event => event.preventDefault(), { passive: false });
      document.addEventListener('gestureend', event => event.preventDefault(), { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchmove', event => {
        if (event.touches && event.touches.length > 1) event.preventDefault();
      }, { passive: false });
      document.addEventListener('touchend', event => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>

    const normalizeTimeSlots = (slots) => {
      const slotSet = new Set(Array.isArray(slots) ? slots : []);
      return TARGET_TIME_SLOTS.map(slot => slot.id).filter(id => slotSet.has(id));
    };

    const inferTargetTimeSlots = (item) => {
      const text = `${item.name || ''} ${item.detail || ''} ${item.tag || ''} ${item.memo || ''}`;
      const slots = new Set();
      if (/リセ|リセット|朝一|朝イチ/.test(text)) slots.add('morning');
      if (/示唆|周期|ゾーン|メニュー|天国/.test(text)) {
        slots.add('afternoon');
        slots.add('evening');
      }
      if (/天井|優遇|差枚|凹み|穢れ|スルー|上位/.test(text)) {
        slots.add('evening');
        slots.add('late');
      }
      if (slots.size === 0 && item.tier !== '内部仕様') {
        slots.add('afternoon');
        slots.add('evening');
      }
      return normalizeTimeSlots([...slots]);
    };

    const getTargetTimeSlots = (item) => {
      const baseSlots = item.timeSlots && item.timeSlots.length
        ? item.timeSlots
        : (TARGET_TIME_SLOT_MAP[item.id] || []);
      const inferredSlots = inferTargetTimeSlots(item);
      const slots = baseSlots.length ? baseSlots : inferredSlots;
      return normalizeTimeSlots(
        inferredSlots.includes('morning') && !slots.includes('morning')
          ? ['morning', ...slots]
          : slots
      );
    };

        return;

        name: option.name,
        maker,
        introducedAt: option.introducedAt || "",

      const targets = highlights.filter(Boolean);
      if (!targets.length) return text;

      const parts = [];
      let cursor = 0;
      targets.forEach((target, index) => {
        const foundAt = text.indexOf(target, cursor);
        if (foundAt === -1) return;
        if (foundAt > cursor) parts.push(text.slice(cursor, foundAt));
        parts.push(
          <span
            key={`${target}-${index}`}
            className="text-red-500 bg-red-100/80 px-0.5 rounded-sm box-decoration-clone"
          >

          </span>

        cursor = foundAt + target.length;

      if (cursor < text.length) parts.push(text.slice(cursor));

      const variants = useMemo(() => {
        if (!url) return [];
        if (url.startsWith('http') || url.startsWith('data:')) return [url];
        const cleanName = url.replace(/^\.\//, '').replace(/^\//, '');
        return [cleanName, `./${cleanName}`, `/${cleanName}`];

      const [isWorkloadModalOpen, setIsWorkloadModalOpen] = useState(false);
      const [workloadForm, setWorkloadForm] = useState(EMPTY_WORKLOAD_FORM);
      const [isMachineDropdownOpen, setIsMachineDropdownOpen] = useState(false);
      const [activeMachineOptionIndex, setActiveMachineOptionIndex] = useState(0);
      const [selectedTargetLabel, setSelectedTargetLabel] = useState('');

      const machineOptions = useMemo(() => buildMachineOptions(rukoItems), [rukoItems]);
      const activeStrategySection = STRATEGY_SECTION_DATA.find(section => section.id === activeStrategySectionId) || null;
      const activeStrategyStyles = activeStrategySection
        ? STRATEGY_ACCENT_STYLES[activeStrategySection.accent] || STRATEGY_ACCENT_STYLES.blue
        : STRATEGY_ACCENT_STYLES.blue;
      const ActiveStrategyIcon = activeStrategySection?.icon || BookOpen;
      const targetPreset = useMemo(() => findTargetPreset(workloadForm.machineName), [workloadForm.machineName]);
      const workloadPreviewValue = useMemo(
        () => calculateWorkValue(workloadForm.payoutRate, workloadForm.playTime),
        [workloadForm.payoutRate, workloadForm.playTime]
      );

      const filteredMachineOptions = useMemo(() => {
        const query = normalizeMachineText(workloadForm.machineName);
        const matchedOptions = query
          ? machineOptions.filter(option => (
              normalizeMachineText([
                option.name,
                option.maker,
                option.introducedAt,
                ...(option.aliases || [])
              ].join(' ')).includes(query)
            ))
          : machineOptions;

        return matchedOptions.slice(0, 8);
      }, [machineOptions, workloadForm.machineName]);

      useEffect(() => {
        setActiveMachineOptionIndex(0);
        setSelectedTargetLabel('');
      }, [workloadForm.machineName]);

      useEffect(() => {
        if (!isWorkloadModalOpen) setIsMachineDropdownOpen(false);
      }, [isWorkloadModalOpen]);

      const selectMachineOption = (option) => {
        setWorkloadForm(prev => ({ ...prev, machineName: option.name }));
        setIsMachineDropdownOpen(false);
        setActiveMachineOptionIndex(0);
      };

      const applyTargetPreset = (target) => {
        setWorkloadForm(prev => ({ ...prev, payoutRate: target.payoutRate }));
        setSelectedTargetLabel(target.label);
      };

      const adjustPayoutRate = (delta) => {
        setSelectedTargetLabel('');
        setWorkloadForm(prev => {
          const currentRate = parseFloat(prev.payoutRate);
          const baseRate = Number.isFinite(currentRate) ? currentRate : 100;
          const nextRate = Math.round((baseRate + delta) * 10) / 10;
          return { ...prev, payoutRate: nextRate.toString() };
        });
      };

      const handlePayoutRateKeyDown = (e) => {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          adjustPayoutRate(0.5);
        }

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          adjustPayoutRate(-0.5);
        }
      };

      const handleMachineInputKeyDown = (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setIsMachineDropdownOpen(true);
          setActiveMachineOptionIndex(prev => Math.min(prev + 1, Math.max(filteredMachineOptions.length - 1, 0)));
          return;
        }

        if (e.key === 'ArrowUp') {
          e.preventDefault();
          setActiveMachineOptionIndex(prev => Math.max(prev - 1, 0));
          return;
        }

        if (e.key === 'Enter' && isMachineDropdownOpen && filteredMachineOptions[activeMachineOptionIndex]) {
          e.preventDefault();
          selectMachineOption(filteredMachineOptions[activeMachineOptionIndex]);
          return;
        }

        if (e.key === 'Escape') {
          setIsMachineDropdownOpen(false);
        }
      };

      const handleWorkloadTimeChange = (e) => {
        const time = e.target.value;
        setWorkloadForm(prev => ({
          ...prev, 
          playTime: time, 
          playCount: time ? Math.round((parseFloat(time) / 60) * 800).toString() : ''
        }));
      };

      const handleWorkloadCountChange = (e) => {
        const count = e.target.value;
        setWorkloadForm(prev => ({
          ...prev, 
          playCount: count, 
          playTime: count ? Math.round((parseFloat(count) / 800) * 60).toString() : ''
        }));
      };

      const formatDateStr = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const displayDateStr = (date) => {
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        return `${date.getMonth() + 1}/${date.getDate()} (${days[date.getDay()]})`;
      };

      const displayMonthStr = (date) => `${date.getFullYear()}年 ${date.getMonth() + 1}月`;

      const formatSignedAmount = (value, withYen = false) => {
        const safeValue = Number(value) || 0;
        const prefix = safeValue > 0 ? '+' : safeValue < 0 ? '' : '±';
        return `${prefix}${safeValue.toLocaleString()}${withYen ? '円' : ''}`;
      };

      const changeDate = (days) => {
        const newDate = new Date(currentDate);
        newDate.setDate(newDate.getDate() + days);
        setCurrentDate(newDate);
      };

      const changeMonth = (months) => {
        setCurrentDate(prev => {
          const year = prev.getFullYear();
          const targetMonth = prev.getMonth() + months;
          const lastDay = new Date(year, targetMonth + 1, 0).getDate();
          return new Date(year, targetMonth, Math.min(prev.getDate(), lastDay));
        });
      };

      const selectCalendarDate = (date) => {
        setCurrentDate(new Date(date.getFullYear(), date.getMonth(), date.getDate()));
      };

      const currentYear = currentDate.getFullYear();
      const currentMonth = currentDate.getMonth();

      const fetchMonthWorkloads = async (baseDate = currentDate) => {
        if (!supabase || !session) return;
        setWorkloadLoading(true);
        setWorkloadError('');

        try {
          const year = baseDate.getFullYear();
          const month = baseDate.getMonth();
          const monthStart = formatDateStr(new Date(year, month, 1));
          const nextMonthStart = formatDateStr(new Date(year, month + 1, 1));
          const { data, error } = await supabase
            .from('workload_entries')
            .select('id,date,machine_name,payout_rate,play_time,play_count,memo,work_value,created_at')
            .gte('date', monthStart)
            .lt('date', nextMonthStart)
            .order('date', { ascending: true })
            .order('created_at', { ascending: true });

          if (error) throw error;
          setMonthWorkloads((data || []).map(normalizeWorkloadRow));
        } catch (error) {
          setWorkloadError(error.message || '仕事量データを読み込めませんでした');
        } finally {
          setWorkloadLoading(false);
        }
      };

      useEffect(() => {
        if (!supabase) {
          setAuthLoading(false);
          return;
        }

        let mounted = true;
        supabase.auth.getSession()
          .then(({ data, error }) => {
            if (!mounted) return;
            if (error) setAuthError(error.message);
            setSession(data?.session || null);
          })
          .catch(error => {
            if (mounted) setAuthError(error.message || 'ログイン状態を確認できませんでした');
          })
          .finally(() => {
            if (mounted) setAuthLoading(false);
          });

        const { data } = supabase.auth.onAuthStateChange((_event, nextSession) => {
          setSession(nextSession);
          setAuthError('');
          setAuthMessage('');
          if (!nextSession) {
            setMonthWorkloads([]);
            setWorkloadError('');
            setIsWorkloadModalOpen(false);
          }
        });

        return () => {
          mounted = false;
          data?.subscription?.unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (!session || !supabase) return;
        fetchMonthWorkloads(currentDate);
      }, [session, currentYear, currentMonth]);

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        if (!supabase) return;

        const email = authForm.email.trim();
        const password = authForm.password;
        if (!email || !password) {
          setAuthError('メールアドレスとパスワードを入力してください');
          return;
        }

        setAuthSubmitting(true);
        setAuthError('');
        setAuthMessage('');

        try {
          const { error } = authMode === 'login'
            ? await supabase.auth.signInWithPassword({ email, password })
            : await supabase.auth.signUp({ email, password, options: { emailRedirectTo: window.location.href } });

          if (error) throw error;
          setAuthMessage(authMode === 'login'
            ? 'ログインしました'
            : '登録を受け付けました。確認メールが届いた場合は認証後にログインしてください。');
        } catch (error) {
          setAuthError(error.message || '認証に失敗しました');
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleLogout = async () => {
        if (!supabase) return;
        const { error } = await supabase.auth.signOut();
        if (error) setAuthError(error.message);
      };

      const saveShortcutLink = () => {
        const title = shortcutLinkForm.title.trim();
        const url = normalizeShortcutUrl(shortcutLinkForm.url);
        const memo = shortcutLinkForm.memo.trim();

        if (!title) return triggerToast('リンク名を入力してください');
        if (!url) return triggerToast('URLを入力してください');

        try {
          new URL(url);
        } catch (error) {
          return triggerToast('URLの形式を確認してください');
        }

        setShortcutLinks(prev => [
          {
            id: `link-${Date.now()}`,
            title,
            url,
            memo,
          },
          ...prev,
        ]);
        setShortcutLinkForm({ title: '', url: '', memo: '' });
        triggerToast('リンクを追加しました');
      };

      const deleteShortcutLink = (id) => {
        setShortcutLinks(prev => prev.filter(link => link.id !== id));
        triggerToast('リンクを削除しました');
      };

      const migrateLocalWorkloads = async () => {
        if (!supabase || !session) return;
        const localData = readLocalWorkloadBackup();
        const rows = Object.entries(localData).flatMap(([dateKey, items]) => (
          Array.isArray(items)
            ? items
                .filter(item => item && item.machineName)
                .map(item => {
                  const payoutRate = parseFloat(item.payoutRate) || 100;
                  const playTime = parseInt(item.playTime, 10) || 0;
                  const playCount = parseInt(item.playCount, 10) || 0;
                  const savedWorkValue = Number(item.workValue);
                  return {
                    user_id: session.user.id,
                    date: dateKey,
                    machine_name: item.machineName,
                    payout_rate: payoutRate,
                    play_time: playTime,
                    play_count: playCount,
                    memo: item.memo || '',
                    work_value: Number.isFinite(savedWorkValue)
                      ? Math.round(savedWorkValue)
                      : calculateWorkValue(payoutRate, playTime),
                  };
                })
            : []
        ));

        if (rows.length === 0) {
          setHasLocalBackup(false);
          setAuthMessage('移行できる端末内記録はありません');
          return;
        }

        setIsMigratingWorkloads(true);
        setWorkloadError('');
        setAuthMessage('');

        try {
          const { error } = await supabase.from('workload_entries').insert(rows);
          if (error) throw error;
          localStorage.removeItem(WORKLOAD_STORAGE_KEY);
          setHasLocalBackup(false);
          setAuthMessage(`${rows.length}件の端末内記録を移行しました`);
          await fetchMonthWorkloads(currentDate);
        } catch (error) {
          setWorkloadError(error.message || '端末内記録を移行できませんでした');
        } finally {
          setIsMigratingWorkloads(false);
        }
      };

      const saveWorkload = async () => {
        if (!workloadForm.machineName.trim()) return triggerToast('機種名を入力してください');
        if (!supabase || !session) {
          setWorkloadError('仕事量を保存するにはログインが必要です');
          return;
        }
        
        const dateKey = formatDateStr(currentDate);
        const workValue = calculateWorkValue(workloadForm.payoutRate, workloadForm.playTime);
        const payoutRate = parseFloat(workloadForm.payoutRate) || 100;
        const playTime = parseInt(workloadForm.playTime, 10) || 0;
        const playCount = parseInt(workloadForm.playCount, 10) || 0;

        setWorkloadSaving(true);
        setWorkloadError('');

        try {
          const { error } = await supabase.from('workload_entries').insert({
            user_id: session.user.id,
            date: dateKey,
            machine_name: workloadForm.machineName.trim(),
            payout_rate: payoutRate,
            play_time: playTime,
            play_count: playCount,
            memo: workloadForm.memo || '',
            work_value: workValue,
          });

          if (error) throw error;
          setIsWorkloadModalOpen(false);
          setWorkloadForm({ ...EMPTY_WORKLOAD_FORM });
          setSelectedTargetLabel('');
          await fetchMonthWorkloads(currentDate);
        } catch (error) {
          setWorkloadError(error.message || '仕事量を保存できませんでした');
        } finally {
          setWorkloadSaving(false);
        }
      };

      const deleteWorkload = async (dateKey, id) => {
        if (!supabase || !session) return;
        setDeletingWorkloadId(id);
        setWorkloadError('');

        try {
          const { error } = await supabase
            .from('workload_entries')
            .delete()
            .eq('id', id);

          if (error) throw error;
          await fetchMonthWorkloads(currentDate);
        } catch (error) {
          setWorkloadError(error.message || '仕事量を削除できませんでした');
        } finally {
          setDeletingWorkloadId(null);
        }
      };

      const getDateTotalWorkValue = (date) => {
        const dateKey = formatDateStr(date);
        const items = monthWorkloads.filter(item => item.date === dateKey);
        return items.reduce((sum, item) => sum + (Number(item.workValue) || 0), 0);
      };

      const selectedDateKey = formatDateStr(currentDate);
      const todayKey = formatDateStr(new Date());

      const calendarDays = useMemo(() => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDayOfMonth = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cells = [];

        for (let i = 0; i < firstDayOfMonth.getDay(); i++) cells.push(null);
        for (let day = 1; day <= daysInMonth; day++) cells.push(new Date(year, month, day));
        while (cells.length % 7 !== 0) cells.push(null);

        return cells;
      }, [currentDate]);

      const monthTotalWorkValue = useMemo(() => {
        return monthWorkloads.reduce((sum, item) => sum + (Number(item.workValue) || 0), 0);
      }, [monthWorkloads]);

      const currentWorkloads = monthWorkloads.filter(item => item.date === selectedDateKey);


      const exportData = () => {
        const dataStr = JSON.stringify(rukoItems, null, 2);
        navigator.clipboard.writeText(dataStr).then(() => {
          triggerToast("JSONデータをコピーしました！");
        }).catch(err => {
          triggerToast("コピー失敗。");
        });
      };

      const moveItem = (itemId, targetTier) => {
        if (!IS_ADMIN_MODE) return;
        setRukoItems(prev => prev.map(item => item.id === itemId ? { ...item, tier: targetTier } : item));
        setDraggedItemId(null);
        setDragOverTier(null);
      };

      const triggerToast = (msg) => {
        setShowToast(msg);
        setTimeout(() => setShowToast(null), 3000);
      };

      const handleModalSave = () => {
        if (!formData.name) return triggerToast('機種名を入力してください');
        if (modalConfig.mode === 'add') {
          setRukoItems([...rukoItems, { id: `r-${Date.now()}`, ...formData, tier: 'C' }]);
          triggerToast(`${formData.name} を追加しました`);
        } else if (modalConfig.mode === 'edit') {
          setRukoItems(rukoItems.map(i => i.id === modalConfig.itemId ? { ...i, ...formData } : i));
          triggerToast(`更新しました`);
        }
        setModalConfig({ isOpen: false, mode: 'add', itemId: null });
      };

      const deleteItem = (id) => {
        if (IS_ADMIN_MODE) setRukoItems(rukoItems.filter(item => item.id !== id));
      };

      const filteredItems = rukoItems.filter(item => 
        (item.name || '').toLowerCase().includes(searchQuery.toLowerCase()) || 
        (item.detail && item.detail.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      const listItems = useMemo(() => (
        filteredItems
          .map((item, index) => {
            const timeSlots = getTargetTimeSlots(item);
            return {
              ...item,
              timeSlots,
              matchesSelectedTime: targetTimeSort === 'all' || timeSlots.includes(targetTimeSort),
              originalIndex: index,
            };
          })
          .sort((a, b) => {
            if (targetTimeSort !== 'all') {
              if (a.matchesSelectedTime !== b.matchesSelectedTime) return a.matchesSelectedTime ? -1 : 1;
              const aSlotIndex = a.timeSlots.indexOf(targetTimeSort);
              const bSlotIndex = b.timeSlots.indexOf(targetTimeSort);
              if (aSlotIndex !== bSlotIndex) return (aSlotIndex === -1 ? 99 : aSlotIndex) - (bSlotIndex === -1 ? 99 : bSlotIndex);
            }
            return a.originalIndex - b.originalIndex;
          })
      ), [filteredItems, targetTimeSort]);

      const canDrag = IS_ADMIN_MODE && isEditing;
      const renderMemberGate = (title, description) => (
        <div className="p-4 space-y-4 bg-gray-50 min-h-full">
          {!supabase ? (
            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
              <div className="flex items-start gap-3">
                <div className="w-10 h-10 rounded-xl bg-neutral-900 text-white flex items-center justify-center flex-shrink-0">
                  <Database size={20} />
                </div>
                <div className="min-w-0">
                  <h2 className="text-base font-black text-gray-900">Supabase設定が必要です</h2>
                  <p className="mt-2 text-xs leading-relaxed text-gray-600 font-medium">
                    会員限定コンテンツを使うには、Supabaseの接続設定が必要です。
                  </p>
                </div>
              </div>
            </div>
          ) : authLoading ? (
            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center">
              <RefreshCw size={22} className="mx-auto mb-3 text-blue-500 animate-spin" />
              <p className="text-sm font-black text-gray-700">ログイン状態を確認中...</p>
            </div>
          ) : (
            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
              <div className="flex items-start gap-3 mb-4">
                <div className="w-10 h-10 rounded-xl bg-neutral-900 text-white flex items-center justify-center flex-shrink-0">
                  <User size={20} />
                </div>
                <div className="min-w-0">
                  <h2 className="text-base font-black text-gray-900">{title}</h2>
                  <p className="mt-1 text-xs leading-relaxed text-gray-600 font-medium">{description}</p>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2 mb-4 bg-gray-100 p-1 rounded-xl">
                <button
                  type="button"
                  onClick={() => { setAuthMode('login'); setAuthError(''); setAuthMessage(''); }}
                  className={`py-2 rounded-lg text-xs font-black transition-colors ${authMode === 'login' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500'}`}
                >
                  ログイン
                </button>
                <button
                  type="button"
                  onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthMessage(''); }}
                  className={`py-2 rounded-lg text-xs font-black transition-colors ${authMode === 'signup' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500'}`}
                >
                  新規登録
                </button>
              </div>

              <form onSubmit={handleAuthSubmit} className="space-y-3">
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">メールアドレス</label>
                  <input
                    type="email"
                    value={authForm.email}
                    onChange={e => setAuthForm(prev => ({ ...prev, email: e.target.value }))}
                    className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                    placeholder="email@example.com"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">パスワード</label>
                  <input
                    type="password"
                    value={authForm.password}
                    onChange={e => setAuthForm(prev => ({ ...prev, password: e.target.value }))}
                    className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                    placeholder="6文字以上"
                  />
                </div>

                {authError && <p className="text-xs font-bold text-red-500 bg-red-50 border border-red-100 rounded-lg px-3 py-2">{authError}</p>}
                {authMessage && <p className="text-xs font-bold text-blue-600 bg-blue-50 border border-blue-100 rounded-lg px-3 py-2">{authMessage}</p>}

                <button
                  type="submit"
                  disabled={authSubmitting}
                  className="w-full bg-blue-600 disabled:bg-blue-300 text-white font-bold py-3 rounded-xl shadow-md flex justify-center items-center gap-2 active:bg-blue-700 transition-colors"
                >
                  <User size={18} />
                  {authSubmitting ? '処理中...' : authMode === 'login' ? 'ログインする' : '登録する'}
                </button>
              </form>
            </div>
          )}
        </div>
      );

      return (
        <div className="w-full max-w-md mx-auto h-screen overflow-hidden bg-gray-100 flex flex-col select-none font-sans">
          <header className="sticky top-0 z-50 bg-white shadow-md">
            <div className="bg-neutral-900 text-white px-4 py-3 flex flex-col gap-1">
              <div className="flex justify-between items-start">
                <h1 className="text-[10px] font-bold text-blue-400 uppercase tracking-widest leading-none flex items-center gap-2">
                  {activeTab === 'calc' ? "Calculator" : activeTab === 'column' ? "Strategy Notes" : "Ruko App"}
                  {IS_ADMIN_MODE && <span className="bg-red-500 text-white px-1.5 rounded-sm text-[8px]">Admin Mode</span>}
                </h1>
                
                <div className="flex gap-2">
                  {IS_ADMIN_MODE && isEditing && (
                    <button onClick={exportData} className="p-1.5 rounded-full bg-green-600 text-white shadow-lg transition-all active:scale-95 flex items-center justify-center">
                      <Download size={14} />
                    </button>
                  )}
                  {IS_ADMIN_MODE && activeTab !== 'ai' && (
                    <button onClick={() => setIsEditing(!isEditing)} className={`p-1.5 rounded-full transition-all shadow-lg ${isEditing ? 'bg-red-500 rotate-90' : 'bg-blue-600'}`}>
                      {isEditing ? <X size={14} /> : <Edit2 size={14} />}
                    </button>
                  )}
                </div>
              </div>
              
              <div className="flex justify-between items-end mt-1">
                <p className="text-sm sm:text-base font-black italic leading-tight">
                  {activeTab === 'ruko' ? "最新狙い目Tier表" : activeTab === 'list' ? "狙い目一覧" : activeTab === 'column' ? "攻略思考集" : "仕事量管理"}
                </p>
                {(activeTab !== 'workload' && activeTab !== 'column') && (
                  <p className="text-[9px] text-red-500 whitespace-nowrap ml-2 pb-0.5 font-medium">拾いやすさ×期待値</p>
                )}
              </div>
            </div>
          </header>

          <main className="flex-1 overflow-y-auto pb-24" style={{ height: 'calc(100vh - 130px)', scrollbarGutter: 'stable' }}>
            
            {activeTab === 'column' && (
              session ? (
              <div className="p-4 bg-gray-50 min-h-full flex flex-col">
                <div className="flex-1 space-y-4">
                  {!activeStrategySection ? (
                    <>
                      <h2 className="text-lg font-black text-gray-800 flex items-center gap-2">
                        <BookOpen size={20} className="text-blue-500" />
                        攻略思考集
                      </h2>

                      <div className="grid grid-cols-1 gap-2">
                        {STRATEGY_SECTION_DATA.map(section => {
                          const SectionIcon = section.icon;
                          const styles = STRATEGY_ACCENT_STYLES[section.accent] || STRATEGY_ACCENT_STYLES.blue;
                          return (
                            <button
                              key={section.id}
                              type="button"
                              onClick={() => setActiveStrategySectionId(section.id)}
                              className={`w-full border rounded-xl px-3 py-3 flex items-center gap-3 text-left transition-colors ${styles.inactiveButton}`}
                            >
                              <span className={`w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 ${styles.icon}`}>
                                <SectionIcon size={20} />
                              </span>
                              <span className="min-w-0 flex-1">
                                <span className="block text-sm font-black leading-tight">{section.title}</span>
                                <span className="block text-[11px] font-bold text-gray-500 mt-1">{section.subtitle}</span>
                                <span className="block text-[10px] font-black text-gray-400 mt-1">
                                  {section.id === 'links' ? `${shortcutLinks.length}件のリンク` : `${section.items.length}本の記事`}
                                </span>
                              </span>
                              <ChevronRight size={16} className="text-gray-400" />
                            </button>
                          );
                        })}
                      </div>
                    </>
                  ) : (
                    <section className="space-y-3">
                      <button
                        type="button"
                        onClick={() => setActiveStrategySectionId(null)}
                        className="inline-flex items-center gap-1.5 text-xs font-black text-gray-600 bg-white border border-gray-200 rounded-lg px-3 py-2 active:bg-gray-50"
                      >
                        <ChevronLeft size={16} />
                        攻略思考集に戻る
                      </button>

                      <div className="flex items-center gap-2 px-1">
                        <span className={`w-8 h-8 rounded-lg flex items-center justify-center ${activeStrategyStyles.icon}`}>
                          <ActiveStrategyIcon size={18} />
                        </span>
                        <div>
                          <p className="text-[10px] font-black text-gray-400">
                            {activeStrategySection.id === 'links' ? `${shortcutLinks.length} LINKS` : `${activeStrategySection.items.length} NOTES`}
                          </p>
                          <h3 className="text-base font-black text-gray-900">{activeStrategySection.title}</h3>
                        </div>
                      </div>

                      {activeStrategySection.id === 'links' ? (
                        <div className="space-y-3">
                          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 space-y-3">
                            <div>
                              <label className="block text-[10px] font-black text-gray-500 mb-1">リンク名</label>
                              <input
                                type="text"
                                value={shortcutLinkForm.title}
                                onChange={e => setShortcutLinkForm(prev => ({ ...prev, title: e.target.value }))}
                                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                                placeholder="例: ちょんぼりすた"
                              />
                            </div>
                            <div>
                              <label className="block text-[10px] font-black text-gray-500 mb-1">URL</label>
                              <input
                                type="url"
                                value={shortcutLinkForm.url}
                                onChange={e => setShortcutLinkForm(prev => ({ ...prev, url: e.target.value }))}
                                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                                placeholder="https://..."
                              />
                            </div>
                            <div>
                              <label className="block text-[10px] font-black text-gray-500 mb-1">メモ</label>
                              <input
                                type="text"
                                value={shortcutLinkForm.memo}
                                onChange={e => setShortcutLinkForm(prev => ({ ...prev, memo: e.target.value }))}
                                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                                placeholder="例: 解析確認用"
                              />
                            </div>
                            <button
                              type="button"
                              onClick={saveShortcutLink}
                              className="w-full bg-neutral-900 text-white rounded-xl py-3 text-sm font-black flex items-center justify-center gap-2 active:bg-neutral-700"
                            >
                              <Plus size={16} />
                              リンクを追加
                            </button>
                          </div>

                          {shortcutLinks.length === 0 ? (
                            <div className="bg-white rounded-xl border border-dashed border-gray-300 p-5 text-center">
                              <LinkIcon size={22} className="mx-auto text-gray-400 mb-2" />
                              <p className="text-sm font-black text-gray-700">まだリンクがありません</p>
                              <p className="mt-1 text-xs font-bold text-gray-500">よく見る攻略サイトや地域情報を追加できます。</p>
                            </div>
                          ) : (
                            <div className="space-y-2">
                              {shortcutLinks.map(link => (
                                <article key={link.id} className="bg-white rounded-xl shadow-sm border border-gray-200 p-3 flex items-center gap-3">
                                  <div className="min-w-0 flex-1">
                                    <h4 className="text-sm font-black text-gray-900 truncate">{link.title}</h4>
                                    <p className="mt-0.5 text-[11px] font-bold text-blue-600 truncate">{link.url}</p>
                                    {link.memo && <p className="mt-1 text-[11px] font-bold text-gray-500">{link.memo}</p>}
                                  </div>
                                  <a
                                    href={link.url}
                                    target="_blank"
                                    rel="noreferrer"
                                    className="w-9 h-9 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0 active:bg-blue-100"
                                    aria-label={`${link.title}を開く`}
                                  >
                                    <ExternalLink size={16} />
                                  </a>
                                  <button
                                    type="button"
                                    onClick={() => deleteShortcutLink(link.id)}
                                    className="w-9 h-9 rounded-lg bg-red-50 text-red-500 flex items-center justify-center flex-shrink-0 active:bg-red-100"
                                    aria-label={`${link.title}を削除`}
                                  >
                                    <Trash2 size={16} />
                                  </button>
                                </article>
                              ))}
                            </div>
                          )}
                        </div>
                      ) : activeStrategySection.items.map(item => (
                        <article key={item.number} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                          <div className="p-4">
                            <div className="flex items-start gap-3">
                              <span className={`px-2 py-1 rounded-lg text-xs font-black leading-none ${activeStrategyStyles.badge}`}>{item.number}</span>
                              <h4 className="text-[15px] font-black text-gray-900 leading-snug">{item.title}</h4>
                            </div>
                            <p className="mt-3 text-xs text-gray-700 leading-relaxed font-bold">{renderHighlightedText(item.body, item.highlights)}</p>
                            <p className={`mt-3 border rounded-lg px-3 py-2 text-xs leading-relaxed font-black whitespace-pre-line ${activeStrategyStyles.quote}`}>
                              「{item.quote}」
                            </p>
                          </div>
                        </article>
                      ))}
                    </section>
                  )}
                </div>

                <div className="mt-auto pt-6">
                  <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-3 flex items-center justify-between gap-3">
                      <div className="min-w-0">
                        <p className="text-[10px] font-black text-gray-400">ログイン中</p>
                        <p className="text-sm font-black text-gray-800 truncate">{session.user?.email}</p>
                      </div>
                      <button
                        type="button"
                        onClick={handleLogout}
                        className="flex-shrink-0 px-3 py-2 rounded-lg bg-gray-100 text-gray-600 text-xs font-black flex items-center gap-1.5 active:bg-gray-200"
                      >
                        <LogOut size={14} /> ログアウト
                      </button>
                  </div>
                </div>
              </div>
              ) : renderMemberGate(
                '会員限定コンテンツです',
                'ログインすると、攻略思考・旅打ち情報・ショートカットリンクを使えます。'
              )
            )}

            {}
            {activeTab === 'workload' && (
              <div className="p-4 space-y-4 bg-gray-50 min-h-full">
                {!supabase ? (
                  <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
                    <div className="flex items-start gap-3">
                      <div className="w-10 h-10 rounded-xl bg-neutral-900 text-white flex items-center justify-center flex-shrink-0">
                        <Database size={20} />
                      </div>
                      <div className="min-w-0">
                        <h2 className="text-base font-black text-gray-900">Supabase設定が必要です</h2>
                        <p className="mt-2 text-xs leading-relaxed text-gray-600 font-medium">
                          仕事量タブはログイン会員限定です。`SUPABASE_URL` と `SUPABASE_ANON_KEY` を設定すると、ログインフォームとユーザー別保存が有効になります。
                        </p>
                      </div>
                    </div>
                  </div>
                ) : authLoading ? (
                  <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center">
                    <RefreshCw size={22} className="mx-auto mb-3 text-blue-500 animate-spin" />
                    <p className="text-sm font-black text-gray-700">ログイン状態を確認中...</p>
                  </div>
                ) : !session ? (
                  <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
                    <div className="flex items-start gap-3 mb-4">
                      <div className="w-10 h-10 rounded-xl bg-neutral-900 text-white flex items-center justify-center flex-shrink-0">
                        <User size={20} />
                      </div>
                      <div className="min-w-0">
                        <h2 className="text-base font-black text-gray-900">仕事量は会員限定です</h2>
                        <p className="mt-1 text-xs leading-relaxed text-gray-600 font-medium">
                          ログインすると、自分専用の仕事量カレンダーと稼働記録を保存できます。
                        </p>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2 mb-4 bg-gray-100 p-1 rounded-xl">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('login'); setAuthError(''); setAuthMessage(''); }}
                        className={`py-2 rounded-lg text-xs font-black transition-colors ${authMode === 'login' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500'}`}
                      >
                        ログイン
                      </button>
                      <button
                        type="button"
                        onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthMessage(''); }}
                        className={`py-2 rounded-lg text-xs font-black transition-colors ${authMode === 'signup' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500'}`}
                      >
                        新規登録
                      </button>
                    </div>

                    <form onSubmit={handleAuthSubmit} className="space-y-3">
                      <div>
                        <label className="block text-xs font-bold text-gray-600 mb-1">メールアドレス</label>
                        <input
                          type="email"
                          value={authForm.email}
                          onChange={e => setAuthForm(prev => ({ ...prev, email: e.target.value }))}
                          className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                          placeholder="email@example.com"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-600 mb-1">パスワード</label>
                        <input
                          type="password"
                          value={authForm.password}
                          onChange={e => setAuthForm(prev => ({ ...prev, password: e.target.value }))}
                          className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                          placeholder="6文字以上"
                        />
                      </div>

                      {authError && <p className="text-xs font-bold text-red-500 bg-red-50 border border-red-100 rounded-lg px-3 py-2">{authError}</p>}
                      {authMessage && <p className="text-xs font-bold text-blue-600 bg-blue-50 border border-blue-100 rounded-lg px-3 py-2">{authMessage}</p>}

                      <button
                        type="submit"
                        disabled={authSubmitting}
                        className="w-full bg-blue-600 disabled:bg-blue-300 text-white font-bold py-3 rounded-xl shadow-md flex justify-center items-center gap-2 active:bg-blue-700 transition-colors"
                      >
                        <User size={18} />
                        {authSubmitting ? '処理中...' : authMode === 'login' ? 'ログインする' : '登録する'}
                      </button>
                    </form>
                  </div>
                ) : (
                  <>
                    {(hasLocalBackup || authMessage) && (
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 space-y-3">
                      {hasLocalBackup && (
                        <button
                          type="button"
                          onClick={migrateLocalWorkloads}
                          disabled={isMigratingWorkloads}
                          className="w-full bg-neutral-900 disabled:bg-gray-400 text-white text-xs font-black py-2.5 rounded-xl flex items-center justify-center gap-2 active:bg-neutral-800"
                        >
                          <UploadCloud size={16} />
                          {isMigratingWorkloads ? '移行中...' : 'この端末の記録を移行'}
                        </button>
                      )}

                      {authMessage && <p className="text-xs font-bold text-blue-600 bg-blue-50 border border-blue-100 rounded-lg px-3 py-2">{authMessage}</p>}
                    </div>
                    )}

                    {workloadError && (
                      <div className="bg-red-50 border border-red-100 rounded-xl p-3 flex items-center justify-between gap-3">
                        <p className="text-xs font-bold text-red-600 leading-relaxed">{workloadError}</p>
                        <button
                          type="button"
                          onClick={() => fetchMonthWorkloads(currentDate)}
                          className="flex-shrink-0 px-2.5 py-1.5 rounded-lg bg-white text-red-500 text-xs font-black border border-red-100 flex items-center gap-1"
                        >
                          <RefreshCw size={13} /> 再読み込み
                        </button>
                      </div>
                    )}

                    {workloadLoading ? (
                      <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center">
                        <RefreshCw size={22} className="mx-auto mb-3 text-blue-500 animate-spin" />
                        <p className="text-sm font-black text-gray-700">仕事量データを読み込み中...</p>
                      </div>
                    ) : (
                      <>
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                          <div className="bg-neutral-900 text-white px-3 py-2.5 flex items-center justify-between">
                            <button
                              type="button"
                              onClick={() => changeMonth(-1)}
                              className="p-1.5 rounded-full bg-white/15 active:bg-white/25 transition-colors"
                              aria-label="前の月"
                            >
                              <ChevronLeft size={18} />
                            </button>
                            <div className="text-center leading-tight">
                              <p className="text-sm font-black tracking-wide">{displayMonthStr(currentDate)}</p>
                              <p className="text-xs font-black text-yellow-400">{formatSignedAmount(monthTotalWorkValue, true)}</p>
                            </div>
                            <button
                              type="button"
                              onClick={() => changeMonth(1)}
                              className="p-1.5 rounded-full bg-white/15 active:bg-white/25 transition-colors"
                              aria-label="次の月"
                            >
                              <ChevronRight size={18} />
                            </button>
                          </div>

                          <div className="grid grid-cols-7 bg-gray-50 border-b border-gray-200">
                            {CALENDAR_WEEKDAYS.map((day, idx) => (
                              <div
                                key={day}
                                className={`h-7 flex items-center justify-center text-xs font-black ${idx === 0 ? 'text-red-400' : idx === 6 ? 'text-blue-500' : 'text-gray-500'}`}
                              >
                                {day}
                              </div>
                            ))}
                          </div>

                          <div className="grid grid-cols-7">
                            {calendarDays.map((date, idx) => {
                              if (!date) {
                                return <div key={`blank-${idx}`} className="h-12 bg-gray-50/70 border-r border-b border-gray-100 last:border-r-0" />;
                              }

                              const dateKey = formatDateStr(date);
                              const dayTotal = getDateTotalWorkValue(date);
                              const hasWorkloads = monthWorkloads.some(item => item.date === dateKey);
                              const isSelected = dateKey === selectedDateKey;
                              const isToday = dateKey === todayKey;
                              const weekday = date.getDay();

                              return (
                                <button
                                  key={dateKey}
                                  type="button"
                                  onClick={() => selectCalendarDate(date)}
                                  aria-label={`${date.getMonth() + 1}月${date.getDate()}日を選択`}
                                  className={`relative h-12 min-w-0 border-r border-b border-gray-100 px-1.5 py-1 text-left transition-colors active:bg-blue-50 ${
                                    isSelected ? 'bg-blue-50 ring-2 ring-inset ring-blue-500 z-10' : 'bg-white hover:bg-gray-50'
                                  }`}
                                >
                                  <div className="flex items-start justify-between gap-1">
                                    <span className={`text-base font-black leading-none ${
                                      isSelected ? 'text-blue-700' : weekday === 0 ? 'text-red-500' : weekday === 6 ? 'text-blue-600' : 'text-gray-800'
                                    }`}>
                                      {date.getDate()}
                                    </span>
                                    {isToday && <span className="w-1.5 h-1.5 rounded-full bg-yellow-400 mt-0.5 flex-shrink-0" />}
                                  </div>
                                  {hasWorkloads && (
                                    <p className={`mt-1.5 text-[10px] font-black leading-none truncate ${
                                      dayTotal > 0 ? 'text-blue-700' : dayTotal < 0 ? 'text-red-500' : 'text-gray-400'
                                    }`}>
                                      {formatSignedAmount(dayTotal)}
                                    </p>
                                  )}
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        <button 
                          onClick={() => setIsWorkloadModalOpen(true)}
                          className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-md flex justify-center items-center gap-2 active:bg-blue-700 transition-colors"
                        >
                          <Plus size={20} /> 新規稼働を記録する
                        </button>

                        <div className="space-y-3 mt-4">
                          {currentWorkloads.length === 0 ? (
                            <div className="text-center text-gray-400 py-10 text-sm font-bold bg-white rounded-xl border border-gray-100 border-dashed">
                              稼働記録がありません
                            </div>
                          ) : (
                            currentWorkloads.map(item => (
                              <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 relative">
                                <div className="flex justify-between items-start mb-2 pr-6">
                                  <h3 className="font-black text-gray-800">{item.machineName}</h3>
                                  <div className="text-right">
                                    <span className="text-[10px] text-gray-400 font-bold block mb-0.5">仕事量</span>
                                    <span className={`font-black text-lg ${item.workValue >= 0 ? 'text-blue-600' : 'text-red-500'}`}>
                                      {item.workValue > 0 ? '+' : ''}{item.workValue.toLocaleString()}円
                                    </span>
                                  </div>
                                </div>
                                
                                <div className="flex gap-3 text-xs font-medium text-gray-500 bg-gray-50 p-2 rounded-lg mb-2">
                                  <div className="flex items-center gap-1"><Trophy size={12}/> 割: {item.payoutRate}%</div>
                                  <div className="flex items-center gap-1"><Clock size={12}/> {item.playTime}分</div>
                                  <div className="flex items-center gap-1">回転: {item.playCount}G</div>
                                </div>

                                {item.memo && (
                                  <p className="text-xs text-gray-600 whitespace-pre-wrap bg-gray-100 p-2 rounded-lg mt-2">
                                    {item.memo}
                                  </p>
                                )}

                                <button 
                                  type="button"
                                  onClick={() => deleteWorkload(formatDateStr(currentDate), item.id)}
                                  disabled={deletingWorkloadId === item.id}
                                  className="absolute top-3 right-3 text-gray-300 hover:text-red-500 transition-colors p-1 disabled:opacity-40"
                                  aria-label="稼働記録を削除"
                                >
                                  <Trash2 size={16}/>
                                </button>
                              </div>
                            ))
                          )}
                        </div>
                      </>
                    )}
                  </>
                )}
              </div>
            )}

            {activeTab === 'list' && (
              session ? (
              <div className="p-3 space-y-3">
                <div className="bg-white border border-gray-200 rounded-xl p-3 shadow-sm">
                  <div className="flex items-center gap-1.5 mb-2">
                    <Clock size={14} className="text-blue-500" />
                    <p className="text-xs font-black text-gray-700">狙える時間帯で並び替え</p>
                  </div>
                  <div className="grid grid-cols-2 gap-1.5">
                    {TARGET_TIME_SLOT_OPTIONS.map(option => (
                      <button
                        key={option.id}
                        type="button"
                        onClick={() => setTargetTimeSort(option.id)}
                        className={`rounded-lg border px-2 py-2 text-[11px] font-black transition-colors ${
                          targetTimeSort === option.id
                            ? 'border-blue-500 bg-blue-50 text-blue-700 shadow-sm'
                            : 'border-gray-200 bg-gray-50 text-gray-600 active:bg-gray-100'
                        }`}
                      >
                        {option.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="relative mb-2">
                  <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={18} />
                  <input 
                    type="text" 
                    placeholder="機種名や狙い目で検索..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-white border border-gray-200 rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm font-bold text-gray-700"
                  />
                </div>
                <div className="space-y-2">
                  {listItems.map(item => (
                    <div 
                      key={item.id} 
                      onClick={() => {
                        if (!isEditing) {
                          setDetailModalConfig({ isOpen: true, item: item });
                          setIsMemoEditing(false);
                          setEditingMemoText(item.memo || '');
                        }
                      }}
                      className={`bg-white rounded-xl border ${isEditing ? 'border-blue-300' : 'border-gray-200'} p-3 flex items-center gap-3 shadow-sm active:bg-blue-50 transition-colors ${!isEditing ? 'cursor-pointer' : ''}`}
                    >
                      <div className="w-16 h-16 bg-neutral-800 rounded-lg overflow-hidden flex-shrink-0 border border-neutral-700">
                        <CardImage url={item.imageUrl} name={item.name} tag={item.tag} tagColor={item.tagColor} hasLink={!!item.link} />
                      </div>
                      <div className="flex-1 min-w-0 py-1">
                        <div className="flex flex-wrap items-center gap-2 mb-1">
                          <span className="bg-gray-100 text-gray-600 text-[10px] font-black px-1.5 py-0.5 rounded border border-gray-200">
                            Tier: {item.tier}
                          </span>
                          <h3 className="font-bold text-sm truncate text-gray-800">{item.name}</h3>
                        </div>
                        <p className="text-xs text-gray-500 truncate font-medium">{item.detail}</p>
                        <div className="flex flex-wrap gap-1 mt-2">
                          {item.timeSlots.map(slotId => (
                            <span
                              key={`${item.id}-${slotId}`}
                              className={`text-[9px] font-black px-1.5 py-0.5 rounded border ${
                                targetTimeSort === slotId
                                  ? 'bg-blue-600 border-blue-600 text-white'
                                  : 'bg-gray-50 border-gray-200 text-gray-500'
                              }`}
                            >
                              {getTargetTimeLabel(slotId)}
                            </span>
                          ))}
                        </div>
                      </div>
                      {IS_ADMIN_MODE && isEditing && (
                        <div className="flex flex-col gap-2 pl-2 border-l border-gray-100">
                          <button onClick={(e) => { e.stopPropagation(); setFormData({...item}); setModalConfig({isOpen: true, mode: 'edit', itemId: item.id}); }} className="p-2 text-blue-600 bg-blue-50 rounded-full"><Edit2 size={14}/></button>
                          <button onClick={(e) => { e.stopPropagation(); deleteItem(item.id); }} className="p-2 text-red-600 bg-red-50 rounded-full"><Trash2 size={14}/></button>
                        </div>
                      )}
                    </div>
                  ))}
                  {listItems.length === 0 && <div className="text-center text-gray-400 py-10 text-sm font-bold">見つかりませんでした</div>}
                </div>
              </div>
              ) : renderMemberGate(
                '会員限定コンテンツです',
                'ログインすると、機種別の狙い目一覧を閲覧できます。'
              )
            )}

            {}
            {activeTab === 'ruko' && (
              <div className="p-3 space-y-6">
                <div className="bg-white rounded-2xl p-4 shadow-sm border-l-4 border-l-blue-500">
                  <h2 className="text-sm font-black text-gray-800 mb-2 flex items-center gap-2">
                    <MessageSquare size={16} className="text-blue-500" />
                    現環境について
                  </h2>
                  <p className="text-xs text-gray-600 font-medium leading-relaxed whitespace-pre-wrap">
                    GODが急激に拾えなくなったのでS→Aに。{"\n"}
                    転生も相当台数減ったが1台長く打てるのでS維持。{"\n\n"}
                    先月より厳しい環境となった。{"\n\n"}
                    今は戦コレ６が注目株。{"\n"}
                    4月以降のコンプ規制強化を対策をした歪んだ爆裂機がこれからいろいろ出そうではあるので期待。
                  </p>
                </div>

                {TIER_CONFIG.map((tier) => (
                  <div 
                    key={tier.id} 
                    className={`relative rounded-2xl p-1 transition-all duration-300 ${dragOverTier === tier.id ? 'bg-blue-200/50 scale-[1.02] ring-2 ring-blue-400 ring-dashed' : ''}`}
                    onDragOver={(e) => { e.preventDefault(); if (draggedItemId) setDragOverTier(tier.id); }}
                    onDragLeave={() => setDragOverTier(null)}
                    onDrop={(e) => { e.preventDefault(); if (draggedItemId) moveItem(draggedItemId, tier.id); }}
                  >
                    <div className={`w-full h-9 rounded-full mb-3 flex items-center px-6 shadow-lg ${tier.bg} text-white border-b-4 border-black/20`}>
                      <span className="text-2xl font-black italic tracking-tighter drop-shadow-lg">{tier.label}</span>
                    </div>

                    <div className="grid grid-cols-2 gap-3 min-h-[80px]">
                      {filteredItems.filter(i => i.tier === tier.id).map(item => (
                        <div 
                          key={item.id}
                          draggable={canDrag}
                          onDragStart={(e) => { if (canDrag) { setDraggedItemId(item.id); e.dataTransfer.effectAllowed = 'move'; } }}
                          onDragEnd={() => { setDraggedItemId(null); setDragOverTier(null); }}
                          onClick={() => {
                            if (!isEditing) {
                              setDetailModalConfig({ isOpen: true, item: item });
                              setIsMemoEditing(false);
                              setEditingMemoText(item.memo || '');
                            }
                          }}
                          className={`bg-white border-2 border-blue-500 rounded-xl overflow-hidden shadow-md relative transition-all ${canDrag ? 'cursor-grab' : 'cursor-pointer'} ${draggedItemId === item.id ? 'opacity-20 scale-90' : 'active:scale-95'} hover:border-blue-400`}
                        >
                          <CardImage url={item.imageUrl} name={item.name} tag={item.tag} tagColor={item.tagColor} hasLink={!!item.link} />
                          <div className="p-2 bg-neutral-900 text-blue-200 text-[10px] leading-tight min-h-[48px] flex items-center border-t border-neutral-800 italic">
                            {item.detail}
                          </div>
                          {IS_ADMIN_MODE && isEditing && (
                            <div className="absolute top-1 right-1 flex flex-col gap-1 z-20">
                              <button onClick={(e) => { e.stopPropagation(); deleteItem(item.id); }} className="bg-red-600 text-white rounded-full p-1.5 shadow-xl hover:bg-red-700"><Trash2 size={12} /></button>
                              <button onClick={(e) => { e.stopPropagation(); setFormData({...item}); setModalConfig({isOpen: true, mode: 'edit', itemId: item.id}); }} className="bg-blue-600 text-white rounded-full p-1.5 shadow-xl hover:bg-blue-700"><Edit2 size={12} /></button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {}
          <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-gray-200 flex justify-around items-center pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] z-40 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
            <button onClick={() => setActiveTab('ruko')} className={`flex flex-col items-center justify-center w-full h-full gap-1 ${activeTab === 'ruko' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
              <Trophy size={20} className={activeTab === 'ruko' ? 'fill-blue-100' : ''} />
              <span className="text-[10px] font-bold">Tier表</span>
            </button>
            <button onClick={() => setActiveTab('list')} className={`flex flex-col items-center justify-center w-full h-full gap-1 ${activeTab === 'list' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
              <List size={20} />
              <span className="text-[10px] font-bold">狙い目一覧</span>
            </button>
            <button onClick={() => setActiveTab('workload')} className={`flex flex-col items-center justify-center w-full h-full gap-1 ${activeTab === 'workload' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
              <Coins size={20} className={activeTab === 'workload' ? 'fill-blue-100' : ''} />
              <span className="text-[10px] font-bold">仕事量</span>
            </button>
            <button onClick={() => { setActiveTab('column'); setActiveStrategySectionId(null); }} className={`flex flex-col items-center justify-center w-full h-full gap-1 ${activeTab === 'column' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
              <BookOpen size={20} className={activeTab === 'column' ? 'fill-blue-100' : ''} />
              <span className="text-[10px] font-bold">攻略思考集</span>
            </button>
          </nav>

          {}
          {isWorkloadModalOpen && session && (
            <div className="fixed inset-0 bg-black/60 z-[120] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl animate-in fade-in zoom-in-95 duration-200">
                <h2 className="text-lg font-black mb-4 text-gray-800 border-b pb-2 flex items-center gap-2">
                  <Plus size={18} className="text-blue-500"/>
                  稼働を記録 ({displayDateStr(currentDate)})
                </h2>
                
                <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">機種名・狙い目</label>
                    <div className="relative">
                      <div className="relative">
                        <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" size={16} />
                        <input 
                          type="text" 
                          role="combobox"
                          aria-expanded={isMachineDropdownOpen}
                          aria-controls="machine-option-list"
                          aria-autocomplete="list"
                          autoComplete="off"
                          value={workloadForm.machineName}
                          onFocus={() => setIsMachineDropdownOpen(true)}
                          onBlur={() => setTimeout(() => setIsMachineDropdownOpen(false), 120)}
                          onChange={e => {
                            setWorkloadForm({...workloadForm, machineName: e.target.value});
                            setIsMachineDropdownOpen(true);
                          }}
                          onKeyDown={handleMachineInputKeyDown}
                          className="w-full bg-gray-50 border border-gray-300 rounded-lg pl-10 pr-10 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                          placeholder="機種名を検索..."
                        />
                        <ChevronDown size={16} className={`absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 transition-transform ${isMachineDropdownOpen ? 'rotate-180' : ''}`} />
                      </div>

                      {isMachineDropdownOpen && (
                        <div id="machine-option-list" role="listbox" className="mt-2 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden max-h-52 overflow-y-auto">
                          {filteredMachineOptions.length > 0 ? (
                            filteredMachineOptions.map((option, idx) => (
                              <button
                                key={`${option.name}-${idx}`}
                                type="button"
                                role="option"
                                aria-selected={idx === activeMachineOptionIndex}
                                onMouseDown={(e) => e.preventDefault()}
                                onClick={() => selectMachineOption(option)}
                                onMouseEnter={() => setActiveMachineOptionIndex(idx)}
                                className={`w-full text-left px-3 py-2.5 border-b border-gray-100 last:border-b-0 transition-colors ${idx === activeMachineOptionIndex ? 'bg-blue-50' : 'bg-white hover:bg-gray-50'}`}
                              >
                                <div className="flex items-center justify-between gap-2">
                                  <span className="text-sm font-black text-gray-800 leading-tight">{option.name}</span>
                                  {idx === activeMachineOptionIndex && <Check size={14} className="text-blue-500 flex-shrink-0" />}
                                </div>
                                {(option.maker || option.introducedAt) && (
                                  <div className="mt-1 flex items-center gap-2 text-[10px] font-bold text-gray-400">
                                    {option.maker && <span>{option.maker}</span>}
                                    {option.introducedAt && <span>{option.introducedAt}導入</span>}
                                  </div>
                                )}
                              </button>
                            ))
                          ) : (
                            <div className="px-3 py-3 text-xs font-bold text-gray-400">
                              候補なし。入力した名前で保存できます。
                            </div>
                          )}
                        </div>
                      )}
                      <p className="mt-1 text-[10px] font-bold text-gray-400">候補外もそのまま保存できます</p>
                    </div>
                  </div>

                  {targetPreset && (
                    <div>
                      <label className="block text-xs font-bold text-gray-600 mb-1">狙い目</label>
                      <div className="grid grid-cols-2 gap-2">
                        {targetPreset.targets.map(target => (
                          <button
                            key={target.label}
                            type="button"
                            data-target-preset={target.label}
                            onClick={() => applyTargetPreset(target)}
                            className={`rounded-lg border px-3 py-2 text-xs font-black transition-colors ${
                              selectedTargetLabel === target.label
                                ? 'border-blue-500 bg-blue-50 text-blue-700 shadow-sm'
                                : 'border-gray-200 bg-white text-gray-700 active:bg-gray-50'
                            }`}
                          >
                            {target.label}
                            <span className="block mt-0.5 text-[10px] font-bold opacity-70">{target.payoutRate}%</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                  
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1 flex justify-between">
                      <span>想定機械割 (%)</span>
                      <span className="text-[10px] font-normal text-gray-400">101% = 時給500円</span>
                    </label>
                    <input 
                      type="number" step="0.5"
                      value={workloadForm.payoutRate}
                      onKeyDown={handlePayoutRateKeyDown}
                      onChange={e => {
                        setSelectedTargetLabel('');
                        setWorkloadForm({...workloadForm, payoutRate: e.target.value});
                      }}
                      className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                      placeholder="例: 105"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-gray-600 mb-1">稼働時間 (分)</label>
                      <input 
                        type="number" 
                        value={workloadForm.playTime}
                        onChange={handleWorkloadTimeChange}
                        className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                        placeholder="例: 60"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-600 mb-1">回転数 (目安)</label>
                      <input 
                        type="number" 
                        value={workloadForm.playCount}
                        onChange={handleWorkloadCountChange}
                        className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                        placeholder="例: 800"
                      />
                    </div>
                  </div>
                  <p className="text-[10px] text-gray-400 text-right mb-2">※時間と回転数は連動 (1時間=800G)</p>

                  <div className="bg-gray-50 rounded-xl px-4 py-3 text-gray-900 shadow-sm border border-gray-300 flex items-center justify-between gap-3">
                    <div>
                      <p className="text-xs text-gray-700 font-black">仕事量</p>
                    </div>
                    <div className="text-xl font-black whitespace-nowrap text-gray-900">
                      {workloadPreviewValue > 0 ? '+' : ''}{workloadPreviewValue.toLocaleString()}円
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">メモ (任意)</label>
                    <textarea 
                      value={workloadForm.memo}
                      onChange={e => setWorkloadForm({...workloadForm, memo: e.target.value})}
                      className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 min-h-[80px]"
                      placeholder="稼働の振り返りや結果など"
                    />
                  </div>
                </div>

                {workloadError && (
                  <p className="mt-4 text-xs font-bold text-red-500 bg-red-50 border border-red-100 rounded-lg px-3 py-2">
                    {workloadError}
                  </p>
                )}

                <div className="flex gap-3 mt-5 pt-3 border-t border-gray-100">
                  <button onClick={() => setIsWorkloadModalOpen(false)} className="flex-1 bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl active:bg-gray-200">キャンセル</button>
                  <button
                    onClick={saveWorkload}
                    disabled={workloadSaving}
                    className="flex-1 bg-blue-600 disabled:bg-blue-300 text-white font-bold py-2.5 rounded-xl shadow-md active:bg-blue-700"
                  >
                    {workloadSaving ? '保存中...' : '保存'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {IS_ADMIN_MODE && isEditing && (
            <button onClick={() => { setFormData({name: '', detail: '', tag: '', imageUrl: '', link: '', memo: DEFAULT_MEMO_TEMPLATE}); setModalConfig({isOpen: true, mode: 'add', itemId: null}); }} className="fixed bottom-24 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-all z-50 border-[3px] border-white">
              <Plus size={32} />
            </button>
          )}

          {/* Details Modal */}
          {detailModalConfig.isOpen && detailModalConfig.item && (
            <div className="fixed inset-0 bg-black/60 z-[110] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setDetailModalConfig({isOpen: false, item: null})}>
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl animate-in fade-in zoom-in-95 duration-200 flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-start mb-4 flex-none">
                  <h2 className="text-xl font-black text-gray-800 leading-tight pr-4">{detailModalConfig.item.name}</h2>
                  <button onClick={() => setDetailModalConfig({isOpen: false, item: null})} className="p-1.5 bg-gray-100 rounded-full text-gray-500 active:bg-gray-200 transition-colors"><X size={20} /></button>
                </div>
                
                <div className="mb-4 flex-none flex flex-wrap gap-2">
                  {detailModalConfig.item.tag && detailModalConfig.item.tag.split(',').map((t, idx) => {
                    const colors = detailModalConfig.item.tagColor ? detailModalConfig.item.tagColor.split(',') : [];
