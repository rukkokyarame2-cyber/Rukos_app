                    const color = colors[idx] ? colors[idx].trim() : (colors[0] || 'bg-white');
                    return <div key={idx} className={`inline-block px-3 py-1 rounded text-xs font-bold shadow-sm ${color}`}>{t.trim()}</div>;
                  })}
                </div>

                <div className="relative mb-6 flex-1 overflow-hidden flex flex-col min-h-[150px] group">
                  {isMemoEditing ? (
                    <div className="flex flex-col gap-2 h-full animate-in fade-in zoom-in-95 duration-200">
                      <textarea
                        value={editingMemoText}
                        onChange={(e) => setEditingMemoText(e.target.value)}
                        className="w-full bg-white border-2 border-blue-400 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 flex-1 overflow-y-auto shadow-inner resize-none"
                        autoFocus
                      />
                      <div className="flex gap-2 justify-end flex-none">
                        <button onClick={() => setIsMemoEditing(false)} className="px-4 py-2 bg-gray-200 text-gray-700 text-xs font-bold rounded-lg">キャンセル</button>
                        <button onClick={() => {
                          const updatedItem = { ...detailModalConfig.item, memo: editingMemoText };
                          setRukoItems(rukoItems.map(i => i.id === updatedItem.id ? updatedItem : i));
                          setDetailModalConfig({ isOpen: true, item: updatedItem });
                          setIsMemoEditing(false);
                          triggerToast('メモを保存しました');
                        }} className="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg">保存</button>
                      </div>
                    </div>
                  ) : (
                    <>
                      <div className="bg-gray-50 rounded-xl p-4 border border-gray-200 h-full cursor-pointer hover:bg-blue-50 transition-colors overflow-y-auto" onClick={() => setIsMemoEditing(true)}>
                        <p className="text-sm text-gray-700 whitespace-pre-wrap font-medium leading-relaxed pr-6">
                          {detailModalConfig.item.memo || <span className="text-gray-400">詳細な狙い目メモはまだ登録されていません。<br/>ここをタップしてメモを追加・編集できます。</span>}
                        </p>
                      </div>
                      <div className="absolute top-3 right-3 p-1.5 bg-white shadow-sm border border-gray-100 rounded-full text-gray-400 group-hover:text-blue-500 group-hover:border-blue-200 transition-colors pointer-events-none"><Edit2 size={14} /></div>
                    </>
                  )}
                </div>

                <div className="flex flex-col gap-3 flex-none">
                  {detailModalConfig.item.link && (
                    <button onClick={() => window.open(detailModalConfig.item.link, '_blank', 'noopener,noreferrer')} className="w-full flex items-center justify-center gap-2 bg-blue-50 text-blue-600 font-bold py-3.5 rounded-xl border border-blue-200">
                      <ExternalLink size={18} />詳しい解説記事を見る
                    </button>
                  )}
                  <button onClick={() => setDetailModalConfig({isOpen: false, item: null})} className="w-full bg-neutral-800 text-white font-bold py-3.5 rounded-xl shadow-md">閉じる</button>
                </div>
              </div>
            </div>
          )}

          {showToast && (
            <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-neutral-900/90 backdrop-blur-md text-white px-6 py-2.5 rounded-full text-xs font-bold shadow-2xl z-[70] animate-bounce flex flex-col items-center gap-1">
              <Check size={18} className="text-blue-400" />
              <span>{showToast}</span>
            </div>
          )}
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
