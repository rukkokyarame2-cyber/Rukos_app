<!DOCTYPE html>
<html lang="ja" style="background:#030303;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>スロット狙い目ティア管理アプリ</title>
  
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="ruko-app-loading.png">
  <link rel="apple-touch-startup-image" href="ruko-app-loading.png">
  <meta name="theme-color" content="#030303">
  <meta name="apple-mobile-web-app-title" content="RUKO APP">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #030303;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    #root {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .boot-fallback {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #030303;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .boot-fallback__card {
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
      box-shadow: none;
    }

    .boot-fallback__image {
      width: min(74vw, 280px);
      max-height: 46vh;
      border-radius: 22px;
      object-fit: contain;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
    }

    .boot-fallback__brand {
      margin: 18px 0 8px;
      color: #60a5fa;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .boot-fallback__title {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.45;
    }

    .boot-fallback__text {
      margin: 0 0 16px;
      color: #d1d5db;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.7;
    }

    .boot-fallback__button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #ffffff;
      color: #111827;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 900;
    }

    .boot-fallback__detail {
      margin-top: 12px;
      color: #9ca3af;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-word;
    }

    @media (max-width: 768px) {
      input,
      textarea,
      select {
        font-size: 16px;
      }
    }
  </style>
  <script>
    (() => {
      window.__slotAppBooted = false;
      window.__slotAppShowBootError = (message, detail = '') => {
        if (window.__slotAppBooted) return;
        const root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = `
          <div class="boot-fallback" role="alert">
            <div class="boot-fallback__card">
              <img class="boot-fallback__image" src="ruko-app-loading.png" alt="RUKO APP">
              <p class="boot-fallback__brand">RUKO APP</p>
              <h1 class="boot-fallback__title">${message}</h1>
              <p class="boot-fallback__text">通信状況が不安定な時や、ホーム画面アプリの古いキャッシュが残っている時に起こることがあります。再読み込みで復帰できるようにしました。</p>
              <button class="boot-fallback__button" type="button" onclick="location.reload()">再読み込みする</button>
              ${detail ? `<p class="boot-fallback__detail">${String(detail).replace(/[<>&"]/g, char => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[char]))}</p>` : ''}
            </div>
          </div>
        `;
      };

      window.addEventListener('error', event => {
        const target = event.target;
        if (target && target.tagName === 'SCRIPT') {
          window.__slotAppShowBootError('アプリの読み込みに失敗しました', target.src || '');
          return;
        }
        if (event.message) {
          window.__slotAppShowBootError('アプリの起動に失敗しました', event.message);
        }
      }, true);

      window.addEventListener('unhandledrejection', event => {
        const reason = event.reason;
        const detail = reason && reason.message ? reason.message : String(reason || '');
        window.__slotAppShowBootError('アプリの起動に失敗しました', detail);
      });

      window.addEventListener('load', () => {
        window.setTimeout(() => {
          if (!window.__slotAppBooted) {
            window.__slotAppShowBootError('アプリの読み込みに時間がかかっています');
          }
        }, 12000);

        if ('serviceWorker' in navigator && ['http:', 'https:'].includes(location.protocol)) {
          navigator.serviceWorker.register('./sw.js').catch(error => {
            console.warn('Service Workerを登録できませんでした', error);
          });
        }
      });

      document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', event => event.preventDefault(), { passive: false });
      document.addEventListener('gestureend', event => event.preventDefault(), { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchmove', event => {
        if (event.touches && event.touches.length > 1) event.preventDefault();
      }, { passive: false });
      document.addEventListener('touchend', event => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>
</head>
<body class="bg-gray-100 font-sans" style="background:#030303;">
  <div id="root">
    <div class="boot-fallback boot-loading" aria-live="polite">
      <div class="boot-fallback__card">
        <img class="boot-fallback__image" src="ruko-app-loading.png" alt="RUKO APP">
        <p class="boot-fallback__brand">RUKO APP</p>
        <h1 class="boot-fallback__title">アプリを読み込んでいます</h1>
        <p class="boot-fallback__text">ホーム画面からの起動でも復帰しやすいように、読み込み状態を表示しています。</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
  
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
      }
    }
  </script>
  
  <script type="module" src="app.js?v=20260805-august-spacing-swap"></script>
</body>
</html>
