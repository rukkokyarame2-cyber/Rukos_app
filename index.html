<!DOCTYPE html>
<html lang="ja" style="background:#030303;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>繧ｹ繝ｭ繝・ヨ迢吶＞逶ｮ繝・ぅ繧｢邂｡逅・い繝励Μ</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="ruko-app-loading.png">
  <link rel="apple-touch-startup-image" href="ruko-app-loading.png">
  <meta name="theme-color" content="#030303">
  <meta name="apple-mobile-web-app-title" content="RUKO APP">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #030303;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    #root {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .boot-fallback {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #030303;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .boot-fallback__card {
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
      box-shadow: none;
    }

    .boot-fallback__image {
      width: min(74vw, 280px);
      max-height: 46vh;
      border-radius: 22px;
      object-fit: contain;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
    }

    .boot-fallback__brand {
      margin: 18px 0 8px;
      color: #60a5fa;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .boot-fallback__title {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.45;
    }

    .boot-fallback__text {
      margin: 0 0 16px;
      color: #d1d5db;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.7;
    }

    .boot-fallback__button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #ffffff;
      color: #111827;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 900;
    }

    .boot-fallback__detail {
      margin-top: 12px;
      color: #9ca3af;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-word;
    }

    @media (max-width: 768px) {
      input,
      textarea,
      select {
        font-size: 16px;
      }
    }
  </style>
  <script>
    (() => {
      window.__slotAppBooted = false;
      window.__slotAppShowBootError = (message, detail = '') => {
        if (window.__slotAppBooted) return;
        const root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = `
          <div class="boot-fallback" role="alert">
            <div class="boot-fallback__card">
              <img class="boot-fallback__image" src="ruko-app-loading.png" alt="RUKO APP">
              <p class="boot-fallback__brand">RUKO APP</p>
              <h1 class="boot-fallback__title">${message}</h1>
              <p class="boot-fallback__text">騾壻ｿ｡迥ｶ豕√′荳榊ｮ牙ｮ壹↑譎ゅｄ縲√・繝ｼ繝逕ｻ髱｢繧｢繝励Μ縺ｮ蜿､縺・く繝｣繝・す繝･縺梧ｮ九▲縺ｦ縺・ｋ譎ゅ↓襍ｷ縺薙ｋ縺薙→縺後≠繧翫∪縺吶ょ・隱ｭ縺ｿ霎ｼ縺ｿ縺ｧ蠕ｩ蟶ｰ縺ｧ縺阪ｋ繧医≧縺ｫ縺励∪縺励◆縲・/p>
              <button class="boot-fallback__button" type="button" onclick="location.reload()">蜀崎ｪｭ縺ｿ霎ｼ縺ｿ縺吶ｋ</button>
              ${detail ? `<p class="boot-fallback__detail">${String(detail).replace(/[<>&"]/g, char => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[char]))}</p>` : ''}
            </div>
          </div>
        `;
      };

      window.addEventListener('error', event => {
        const target = event.target;
        if (target && target.tagName === 'SCRIPT') {
          window.__slotAppShowBootError('繧｢繝励Μ縺ｮ隱ｭ縺ｿ霎ｼ縺ｿ縺ｫ螟ｱ謨励＠縺ｾ縺励◆', target.src || '');
          return;
        }
        if (event.message) {
          window.__slotAppShowBootError('繧｢繝励Μ縺ｮ襍ｷ蜍輔↓螟ｱ謨励＠縺ｾ縺励◆', event.message);
        }
      }, true);

      window.addEventListener('unhandledrejection', event => {
        const reason = event.reason;
        const detail = reason && reason.message ? reason.message : String(reason || '');
        window.__slotAppShowBootError('繧｢繝励Μ縺ｮ襍ｷ蜍輔↓螟ｱ謨励＠縺ｾ縺励◆', detail);
      });

      window.addEventListener('load', () => {
        window.setTimeout(() => {
          if (!window.__slotAppBooted) {
            window.__slotAppShowBootError('繧｢繝励Μ縺ｮ隱ｭ縺ｿ霎ｼ縺ｿ縺ｫ譎る俣縺後°縺九▲縺ｦ縺・∪縺・);
          }
        }, 12000);

        if ('serviceWorker' in navigator && ['http:', 'https:'].includes(location.protocol)) {
          navigator.serviceWorker.register('./sw.js').catch(error => {
            console.warn('Service Worker繧堤匳骭ｲ縺ｧ縺阪∪縺帙ｓ縺ｧ縺励◆', error);
          });
        }
      });

      document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', event => event.preventDefault(), { passive: false });
      document.addEventListener('gestureend', event => event.preventDefault(), { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchmove', event => {
        if (event.touches && event.touches.length > 1) event.preventDefault();
      }, { passive: false });
      document.addEventListener('touchend', event => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>
</head>
<body class="bg-gray-100 font-sans" style="background:#030303;">
  <div id="root">
    <div class="boot-fallback boot-loading" aria-live="polite">
      <div class="boot-fallback__card">
        <img class="boot-fallback__image" src="ruko-app-loading.png" alt="RUKO APP">
        <p class="boot-fallback__brand">RUKO APP</p>
        <h1 class="boot-fallback__title">繧｢繝励Μ繧定ｪｭ縺ｿ霎ｼ繧薙〒縺・∪縺・/h1>
        <p class="boot-fallback__text">繝帙・繝逕ｻ髱｢縺九ｉ縺ｮ襍ｷ蜍輔〒繧ょｾｩ蟶ｰ縺励ｄ縺吶＞繧医≧縺ｫ縲∬ｪｭ縺ｿ霎ｼ縺ｿ迥ｶ諷九ｒ陦ｨ遉ｺ縺励※縺・∪縺吶・/p>
      </div>
    </div>
  </div>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
      }
    }
  </script>

  <script>
    (() => {
      const appScriptVersion = '20260807-safe-area-calendar';
      const localServerUrl = 'http://127.0.0.1:8187/slot-tier-app.html';

      const loadAppScript = () => {
        const script = document.createElement('script');
        script.type = 'module';
        script.src = `app.js?v=${appScriptVersion}`;
        document.body.appendChild(script);
      };

      const showFileOpenGuide = () => {
        const root = document.getElementById('root');
        if (!root || location.protocol !== 'file:') return;
        root.innerHTML = `
          <div class="boot-fallback" role="alert">
            <div class="boot-fallback__card">
              <img class="boot-fallback__image" src="ruko-app-loading.png" alt="RUKO APP">
              <p class="boot-fallback__brand">RUKO APP</p>
              <h1 class="boot-fallback__title">繝ｭ繝ｼ繧ｫ繝ｫ繧ｵ繝ｼ繝舌・迚医〒髢九＞縺ｦ縺上□縺輔＞</h1>
              <p class="boot-fallback__text">Chrome縺ｧHTML繧堤峩謗･髢九￥縺ｨ縲√い繝励Μ譛ｬ菴薙・隱ｭ縺ｿ霎ｼ縺ｿ縺梧ｭ｢縺ｾ繧九％縺ｨ縺後≠繧翫∪縺吶ゆｸ九・繝懊ち繝ｳ縺九ｉ繝・せ繝育畑URL繧帝幕縺・※縺上□縺輔＞縲・/p>
              <button class="boot-fallback__button" type="button" onclick="location.href='${localServerUrl}'">繝・せ繝育畑URL繧帝幕縺・/button>
            </div>
          </div>
        `;
      };

      if (location.protocol === 'file:') {
        fetch(localServerUrl, { mode: 'no-cors', cache: 'no-store' })
          .then(() => location.replace(localServerUrl))
          .catch(showFileOpenGuide);
        window.setTimeout(showFileOpenGuide, 1200);
        return;
      }

      loadAppScript();
    })();
  </script>
</body>
</html>
